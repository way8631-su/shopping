<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>E.H 水晶達人</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0b16;
    --glass: rgba(255,255,255,0.06);
    --glass-line: rgba(255,255,255,0.14);
    --ink: #f2f0fa;
    --ink-soft: #b7b3cc;
    --accent-a: #8b6bf0;
    --accent-b: #33c9c0;
    --accent-c: #ef5da8;
  }
  /* This page is a deliberately single, dark, glowing world — no light-mode variant. */

  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "Segoe UI", sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  .glow{
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    z-index: 0;
    pointer-events: none;
  }
  .glow.a{ width: 520px; height: 520px; top: -160px; left: -140px; background: var(--accent-a); }
  .glow.b{ width: 480px; height: 480px; top: 30%; left: 42%; background: var(--accent-b); opacity: 0.35; }
  .glow.c{ width: 560px; height: 560px; bottom: -220px; right: -160px; background: var(--accent-c); }

  header, main, footer{ position: relative; z-index: 1; }

  header{
    max-width: 1080px;
    margin: 0 auto;
    padding: 72px 24px 40px;
    text-align: center;
  }
  .mark{
    display:inline-block;
    font-family: "Baloo 2", "Noto Sans TC", sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.08em;
    padding: 7px 18px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    margin-bottom: 22px;
  }
  h1{
    font-family: "Baloo 2", "Noto Sans TC", sans-serif;
    font-weight: 800;
    font-size: clamp(32px, 5vw, 48px);
    margin: 0 0 14px;
    text-wrap: balance;
    background: linear-gradient(120deg, #fff, var(--accent-a) 60%, var(--accent-c));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub{
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 46ch;
    margin: 0 auto;
    line-height: 1.7;
  }

  main{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 100px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 26px;
  }

  .card{
    background: var(--glass);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover{
    transform: translateY(-4px);
    box-shadow: 0 18px 50px rgba(0,0,0,0.45);
  }
  .card .imgwrap{
    aspect-ratio: 1 / 1;
    background: rgba(255,255,255,0.04);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .card img{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
  }
  .noimg{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .card .body{
    padding: 18px 20px 22px;
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
  }
  .card h3{
    font-size: 16.5px;
    font-weight: 700;
    margin:0;
    text-wrap: balance;
  }
  .card .desc{
    font-size: 13px;
    color: var(--ink-soft);
    line-height:1.55;
    flex:1;
  }
  .card .price{
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 17px;
    margin-top: 4px;
    background: linear-gradient(90deg, var(--accent-b), var(--accent-a));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .empty, .error{
    text-align:center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 14px;
  }

  footer{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 24px 48px;
    color: var(--ink-soft);
    font-size: 12px;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }
</style>
</head>
<body>
<div class="glow a"></div>
<div class="glow b"></div>
<div class="glow c"></div>

<header>
  <h1>E.H 串串水晶</h1>
  <p class="sub">瀏覽目前所有品項與價格，展示用途，不提供線上下單。</p>
</header>
<main>
  <div id="grid" class="grid"></div>
  <div id="status"></div>
</main>

<script>
  // 部署時把這裡換成 Apps Script 網頁應用程式網址（見 AppsScript/README.md）
  const API_URL = "";

  const SAMPLE_PRODUCTS = [
    { id: 1, name: "紫水晶手鍊", price: 680, description: "天然紫水晶，圓珠 8mm，彈性繩可調整。", image: "" },
    { id: 2, name: "白水晶項鍊", price: 920, description: "六角柱白水晶墜飾，附皮繩。", image: "" },
    { id: 3, name: "粉晶戒指", price: 450, description: "粉水晶圓珠戒，可調式尺寸。", image: "" },
    { id: 4, name: "黑曜石吊墜", price: 780, description: "天然黑曜石，附鍍銀鍊。", image: "" },
  ];

  function money(n){
    const num = Number(n);
    return isNaN(num) ? n : num.toLocaleString("zh-Hant-TW");
  }

  function renderProducts(products){
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    grid.innerHTML = "";

    if (!products.length){
      status.innerHTML = '<div class="empty">目前沒有上架中的商品。</div>';
      return;
    }
    status.innerHTML = "";

    for (const p of products){
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="imgwrap">
          ${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy">` : `<span class="noimg">無圖片</span>`}
        </div>
        <div class="body">
          <h3>${p.name}</h3>
          <div class="desc">${p.description || ""}</div>
          <div class="price">NT$ ${money(p.price)}</div>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  async function load(){
    if (!API_URL){
      renderProducts(SAMPLE_PRODUCTS);
      document.getElementById("status").innerHTML =
        '<div class="empty">目前顯示示範資料 — 接上 Google Sheet 後台後會自動換成真實商品。</div>';
      return;
    }
    try{
      const res = await fetch(API_URL);
      const data = await res.json();
      renderProducts(data.products || []);
    }catch(err){
      document.getElementById("status").innerHTML = '<div class="error">商品資料載入失敗，請稍後再試。</div>';
    }
  }

  load();
</script>
</body>
</html>
