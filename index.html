<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <!-- 引入 Google Fonts 提升字體質感 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            background-color: #0d0f17;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 動態流光背景效果 */
        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: #7928CA;
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 350px;
            height: 350px;
            background: #FF0080;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            background: #00DFD8;
            bottom: 20%;
            left: 20%;
            animation-delay: -3s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(50px, 40px) scale(1.1);
            }
        }

        /* 主要內容卡片（玻璃擬物風格） */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 3rem 4rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 標題與字體漸層 */
        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #FFF 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        p {
            font-size: 1.1rem;
            font-weight: 300;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* 訂閱/通知表單 */
        .subscribe-form {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        .subscribe-form input[type="email"] {
            padding: 14px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            outline: none;
            flex: 1;
            transition: all 0.3s ease;
        }

        .subscribe-form input[type="email"]::placeholder {
            color: #94a3b8;
        }

        .subscribe-form input[type="email"]:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .subscribe-form button {
            padding: 14px 28px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .subscribe-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
        }

        .subscribe-form button:active {
            transform: translateY(0);
        }

        /* 頁腳小字 */
        .footer-text {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        /* 手機板適應 */
        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            .subscribe-form {
                flex-direction: column;
            }

            .subscribe-form button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- 背景動態光暈 -->
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- 主要內容區塊 -->
    <div class="container">
        <h1>Coming Soon</h1>
        <p>我們正在努力為您打造全新體驗！網站即將上線，敬請期待。</p>
        
        <!-- Email 訂閱框 -->
        <form class="subscribe-form" onsubmit="event.preventDefault(); alert('感謝您的訂閱！我們會第一時間通知您。');">
            <input type="email" placeholder="輸入您的 Email 獲取最新通知" required>
            <button type="submit">獲得通知</button>
        </form>

        <div class="footer-text">
            © 2026 Your Company. All rights reserved.
        </div>
    </div>

</body>
</html>
